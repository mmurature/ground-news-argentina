# Léxico de lenguaje cargado políticamente — borrador v1
#
# Usado por metricas.py para calcular Bias Intensity sin LLM: cada
# aparición de uno de estos términos en un título cuenta como "lenguaje
# cargado", sin importar de qué lado del espectro venga — esto mide
# INTENSIDAD (qué tan cargado titula un medio), no DIRECCIÓN. La
# dirección política ya la da posicion_editorial en feeds.yaml.
#
# Es un borrador armado por Claude, pensado para que Max lo edite
# libremente: agregar, sacar o afinar términos según lo que vea en la
# cobertura real. Es un yaml plano, cada entrada es independiente.

terminos:
