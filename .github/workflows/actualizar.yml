name: Actualizar Ground News Argentina

on:
  schedule:
    - cron: "0 */3 * * *"  # cada 3 horas (UTC)
  workflow_dispatch: {}     # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recolectar notas
        run: python recolector.py

      - name: Agrupar historias
        run: python agrupar.py

      - name: Generar la página
        run: python generar_pagina.py

      - name: Subir los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias.db docs/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que subir."
            exit 0
          fi
          git commit -m "Actualización automática"
          git pull --rebase origin main
          git push
