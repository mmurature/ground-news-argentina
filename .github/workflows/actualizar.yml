name: Actualizar Ground News Argentina

on:
  schedule:
    - cron: "0 */3 * * *"  # cada 3 horas (UTC)
  workflow_dispatch: {}     # permite correrlo a mano desde la pestaña Actions

# Evita que dos corridas (ej. la automática y una manual) se pisen
# intentando pushear al mismo tiempo: si ya hay una corriendo, la
# siguiente espera en cola en vez de correr en paralelo.
concurrency:
  group: actualizar-puente
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recolectar notas
        run: python recolector.py

      - name: Agrupar historias
        run: python agrupar.py

      - name: Generar la página
        run: python generar_pagina.py

      - name: Subir los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/ noticias.db
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que subir."
            exit 0
          fi
          git commit -m "Actualización automática"

          # noticias.db es binario y docs/ se regenera entero cada corrida:
          # si otro push (manual o de otra corrida) tocó esos mismos archivos
          # mientras esta corría, un rebase normal no puede mezclarlos (un
          # sqlite no admite merge de contenido) y queda trabado en conflicto
          # sin importar cuántas veces se reintente. En vez de rebase, se
          # hace merge con -X ours: como este job SOLO toca noticias.db y
          # docs/, cualquier conflicto real va a estar ahí, y "ours" se
          # queda con la versión recién regenerada (correcta, porque ya
          # incluye lo último). Cualquier otro archivo (feeds.yaml, scripts)
          # que haya cambiado en origin mientras tanto se sigue mezclando
          # normal, sin tocarlo.
          for intento in 1 2 3; do
            git fetch origin main
            if git merge --no-edit -X ours origin/main && git push; then
              echo "Push OK (intento $intento)."
              exit 0
            fi
            git merge --abort 2>/dev/null || true
            echo "Intento $intento falló, reintentando en 5s..."
            sleep 5
          done
          echo "No se pudo pushear después de 3 intentos."
          exit 1
