# Puente — feeds de medios (etapa 1 + ampliación de cobertura)
# "confirmados" son los que ya están corriendo en el sitio. "candidatos"
# son URLs encontradas por investigación pero sin confirmar todavía —
# correr validar_feeds.py y mover a "confirmados" los que anden.
# Ver notas.md para el detalle de qué se probó y por qué se descartó
# cada medio que no entró.
#
# posicion_editorial: escala 1 (Izquierda) a 21 (Derecha), centro en 11.
# Admite decimales para más precisión (ej. 9.3, 14.7) desde la revisión
# de septiembre 2026, que refinó los 17 valores originales e investigó
# los 3 que estaban sin clasificar (La Capital, Crónica, Cadena 3).
# fuente_posicion indica de dónde sale ese número (Media Bias/Fact Check,
# estudios académicos, propiedad/vínculos documentados del medio,
# autodescripción, o criterio editorial de Max cuando no hay fuente
# pública confiable). Todos los medios confirmados están clasificados;
# no quedan "sin clasificar".

confirmados:
  - medio: "La Nación"
    tipo: "Diario nacional"
    feed_url: "https://www.lanacion.com.ar/arc/outboundfeeds/rss/"
    posicion_editorial: 18.6
    fuente_posicion: "Media Bias/Fact Check (Right-Center) + estudios académicos (SciELO México, \"Tres medios y dos presidencias\") que la ubican en centro-derecha/derecha, con sesgo partidario algo menor al de Clarín"

  - medio: "Perfil"
    tipo: "Diario y portal nacional"
    feed_url: "https://www.perfil.com/feed"
    posicion_editorial: 10.8
    fuente_posicion: "Criterio editorial de Max (posicionamiento transversal) + editorial explícita de Fontevecchia en 2023 llamando a votar en contra de Milei, tras histórica postura crítica de Kirchner/CFK y Menem por igual"

  - medio: "Ámbito"
    tipo: "Economía y política"
    feed_url: "https://www.ambito.com/rss/pages/home.xml"
    posicion_editorial: 9.6
    fuente_posicion: "Línea económica difícil de reducir al eje izq-der + paso documentado por Grupo Indalo (Cristóbal López, descrito como \"empresario kirchnerista\" por La Nación) entre 2015 y 2016"

  - medio: "La Izquierda Diario"
    tipo: "Portal nacional"
    feed_url: "https://www.laizquierdadiario.com/spip.php?page=backend"
    posicion_editorial: 2.0
    fuente_posicion: "Autodescripción (medio del PTS, trotskista) + análisis de Nueva Sociedad sobre el trotskismo argentino que lo describe como vocero explícito de esa tradición"

  - medio: "Infobae"
    tipo: "Portal nacional"
    feed_url: "https://www.infobae.com/arc/outboundfeeds/rss/"
    posicion_editorial: 9.3
    fuente_posicion: "Media Bias/Fact Check (Left-Center) + estudios sobre elecciones argentinas que lo encuentran cerca del centro; literatura académica en tensión (un paper lo ubica center-left, otro center-right junto a Clarín/TN)"
    nota: "El feed funciona, pero en la prueba trajo notas de España/internacionales mezcladas con Argentina. Revisar si hay un feed específico de la sección Argentina."

  - medio: "Página/12"
    tipo: "Diario nacional"
    feed_url: "https://www.pagina12.com.ar/arc/outboundfeeds/rss/portada"
    posicion_editorial: 5.0
    fuente_posicion: "Literatura académica (SciELO México, \"Tres medios y dos presidencias\") que lo identifica con el sesgo partidario más fuerte entre Clarín/La Nación/Página12, claramente de izquierda"

  - medio: "Los Andes"
    tipo: "Diario regional (Mendoza)"
    feed_url: "https://www.losandes.com.ar/rss/pages/ultimas-noticias.xml"
    posicion_editorial: 12.4
    fuente_posicion: "Diario tradicional de Mendoza asociado a posiciones liberales/conservadoras; cambió de manos en 2024 a empresarios mendocinos con vínculos en espacios de Cambia Mendoza (centro-derecha provincial)"

  - medio: "Río Negro"
    tipo: "Diario regional (Patagonia norte)"
    feed_url: "https://www.rionegro.com.ar/feed/"
    posicion_editorial: 11.0
    fuente_posicion: "Medio regional patagónico sin línea editorial que justifique alejarlo del centro con la evidencia disponible; cambio de dueño en 2025 sin alineamiento político documentado"

  - medio: "La Gaceta"
    tipo: "Diario regional (Tucumán)"
    feed_url: "https://feeds.feedburner.com/LaGaceta-General"
    posicion_editorial: 15.3
    fuente_posicion: "Tradición editorial liberal y republicana + apoyo editorial documentado al Proceso de Reorganización Nacional y vínculos familiares con el interventor Bussi en Tucumán (Wikipedia)"

  - medio: "Misiones Online"
    tipo: "Portal regional (Misiones)"
    feed_url: "https://misionesonline.net/feed/"
    posicion_editorial: 12.0
    fuente_posicion: "Medio provincial/generalista; sin evidencia que justifique una posición cercana a los extremos"

  - medio: "Diario Registrado"
    tipo: "Portal nacional"
    feed_url: "https://www.diarioregistrado.com/rss.xml"
    posicion_editorial: 6.3
    fuente_posicion: "Fundado por Diego Gvirtz (creador de \"6,7,8\", pro-kirchnerista); controlado por Grupo Indalo (Cristóbal López), mismo grupo que controló Ámbito Financiero"

  - medio: "El Día"
    tipo: "Diario regional (La Plata)"
    feed_url: "https://www.eldia.com/.rss"
    posicion_editorial: 13.6
    fuente_posicion: "Historia editorial ligada a posiciones liberales y opositoras al peronismo + apoyo editorial documentado de la familia Kraiselburd al golpe de 1976 (Wikipedia), sin implicar posición extrema hoy"

  - medio: "El Intransigente"
    tipo: "Portal regional (Salta / NOA)"
    feed_url: "https://elintransigente.com/feed/"
    posicion_editorial: 14.2
    fuente_posicion: "Trayectoria históricamente opositora al peronismo; autodescripción actual como medio \"sin compromisos partidarios\" sugiere una posición algo más moderada de lo estimado originalmente (evidencia débil)"

  - medio: "Clarín"
    tipo: "Diario nacional"
    feed_url: "https://www.clarin.com/rss/lo-ultimo/"
    posicion_editorial: 17.4
    fuente_posicion: "Media Bias/Fact Check (Right-Center, score más alto que La Nación) + SciELO México: mayor intensidad de sesgo partidario (anti-K/pro-Macri) que La Nación"

  - medio: "TN"
    tipo: "Portal nacional"
    feed_url: "https://tn.com.ar/feed/"
    posicion_editorial: 16.3
    fuente_posicion: "Mismo grupo que Clarín (Grupo Clarín/Artear) + papers académicos (Nature 2024, arXiv) que lo agrupan center-right junto a Clarín y La Nación"

  - medio: "Buenos Aires Times"
    tipo: "Diario nacional en inglés"
    feed_url: "https://www.batimes.com.ar/feed"
    posicion_editorial: 13.0
    fuente_posicion: "Media Bias/Fact Check (Right-Center): títulos con carga emocional favorables a Macri/Bullrich, con alta factualidad — medio de Grupo Perfil"

  - medio: "MercoPress"
    tipo: "Portal internacional (Mercosur/Cono Sur, en inglés)"
    feed_url: "https://en.mercopress.com/rss/"
    posicion_editorial: 11.0
    fuente_posicion: "Agencia regional/económica con base en Uruguay; sin evidencia de una posición ideológica marcada en el eje argentino"

  - medio: "La Capital"
    tipo: "Diario regional (Rosario)"
    feed_url: "https://www.lacapital.com.ar/rss/ultimas-noticias.xml"
    posicion_editorial: 10.5
    fuente_posicion: "Propiedad: familia Lagos → Grupo América (Vila-Manzano) 1997-2019 → Grupo Scaglione (también dueño de Telefe) desde 2019; apoyo editorial documentado a la Ley de Servicios Audiovisuales de 2009 (evidencia parcial/ambigua)"

  - medio: "Crónica"
    tipo: "Diario popular nacional"
    feed_url: "https://www.cronica.com.ar/feed/feed.xml"
    posicion_editorial: 9.0
    fuente_posicion: "Propiedad de Grupo Olmos desde 2005, con vínculos documentados (Media Ownership Monitor) entre sus dueños y el sindicalismo alineado al kirchnerismo; tradición histórica de periodismo popular/peronista"

  - medio: "Cadena 3"
    tipo: "Radio y portal nacional (con base en Córdoba)"
    feed_url: "https://cadena3.com/rss/PoliticayEconomia.xml"
    posicion_editorial: 14.5
    fuente_posicion: "Cobertura periodística documenta línea consistentemente crítica del kirchnerismo (entrevistas de Mario Pereyra) y audiencia en una Córdoba caracterizada como opositora al gobierno nacional peronista; propietario ligado a círculos agroindustriales cordobeses"

  - medio: "El Cohete a la Luna"
    tipo: "Portal de análisis/opinión"
    feed_url: "https://www.elcohetealaluna.com/feed/"
    posicion_editorial: 3.3
    fuente_posicion: "Portal fundado y dirigido por Horacio Verbitsky (ex Página/12), con editoriales que también se emiten en AM530 (radio popular identificada con el kirchnerismo); línea de investigación/opinión consistentemente alineada al campo nacional-popular"

  - medio: "Canal Abierto"
    tipo: "Portal sindical/DDHH"
    feed_url: "https://canalabierto.com.ar/feed/"
    posicion_editorial: 3.6
    fuente_posicion: "Vínculo institucional documentado con la CTA Autónoma (aparece como \"Agencia CTA\" en su propio sitio); cobertura centrada en sindicalismo y derechos humanos desde una perspectiva de izquierda sindical"

  - medio: "Contraeditorial"
    tipo: "Portal de opinión política"
    feed_url: "https://contraeditorial.com/feed/"
    posicion_editorial: 4.3
    fuente_posicion: "Autodescripción en su página \"Quiénes somos\": periodismo \"contrahegemónico\" frente al \"poder corporativo del neoliberalismo\"; dirigido por Roberto Caballero (ex director de Tiempo Argentino y El Destape TV), figura identificada con el kirchnerismo"

  - medio: "El Grito del Sur"
    tipo: "Portal de política y sociedad"
    feed_url: "https://elgritodelsur.com.ar/feed/"
    posicion_editorial: 3.7
    fuente_posicion: "Medio vinculado a Ofelia Fernández (ex legisladora porteña de La Cámpora); cobertura periodística (Nota al Pie, abril-mayo 2025) sobre intentos del gobierno de Milei de desalojarlos de su oficina, consistente con un alineamiento kirchnerista de izquierda"

  - medio: "Infocielo"
    tipo: "Portal de política y economía (Buenos Aires)"
    feed_url: "https://infocielo.com/feed"
    posicion_editorial: 4.8
    fuente_posicion: "Medio cercano al Sindicato de Camioneros (Moyano); notas propias con enfoque sindical-crítico de los medios tradicionales (ej. \"Doble vara de Clarín y sus satélites al 'fuck you' de Pablo Moyano\"). Izquierda sindical/de poder más que ideológica, por eso más cerca del centro que los otros medios de izquierda del roster"

  - medio: "Periodismo de Izquierda"
    tipo: "Portal de análisis/opinión (partidario)"
    feed_url: "https://www.periodismodeizquierda.com/feed/"
    posicion_editorial: 2.3
    fuente_posicion: "Medio del MST (Movimiento Socialista de los Trabajadores), integrante del FIT-U; misma familia trotskista que La Izquierda Diario (PTS) pero de otro partido"

  - medio: "La Tinta"
    tipo: "Portal cooperativo (Córdoba)"
    feed_url: "https://latinta.com.ar/feed/"
    posicion_editorial: 3.5
    fuente_posicion: "Se autodescribe en su propio feed como \"Medio cooperativo de Córdoba\"; cobertura de movimientos sociales, género y ambiente desde una perspectiva de izquierda social no partidaria"

  - medio: "Lavaca"
    tipo: "Agencia de noticias cooperativa"
    feed_url: "https://lavaca.org/feed/"
    posicion_editorial: 3.8
    fuente_posicion: "Se autodescribe como \"Agencia de noticias de libre circulación\"; cooperativa de periodistas (también edita la revista MU) con foco histórico en movimientos sociales, DDHH y feminismo"

  - medio: "DiarioAR"
    tipo: "Portal nacional"
    feed_url: "https://www.eldiarioar.com/rss/"
    posicion_editorial: 5.5
    fuente_posicion: "Medio fundado en 2021 por un grupo de periodistas (Martín Sivak entre otros) con línea progresista/feminista; más institucional y menos combativo que el resto del bloque de izquierda del roster, por eso más cerca del centro"

  - medio: "La Retaguardia"
    tipo: "Portal de DDHH y juicios"
    feed_url: "https://laretaguardia.com.ar/feed/"
    posicion_editorial: 3.6
    fuente_posicion: "Colectivo de comunicación popular sostenido por aportes (\"Tu aporte nos sostiene\"), especializado en cobertura de juicios de lesa humanidad y derechos humanos en vivo"

  - medio: "Red Eco Alternativo"
    tipo: "Colectivo de comunicación"
    feed_url: "https://www.redeco.com.ar/feed"
    posicion_editorial: 3.8
    fuente_posicion: "Se autodescribe como \"Colectivo de Comunicación y Cultura\"; cobertura de conflictos ambientales, laborales y sociales desde una perspectiva de comunicación alternativa"

  - medio: "Indymedia Argentina"
    tipo: "Colectivo de publicación abierta"
    feed_url: "https://argentina.indymedia.org/feed/"
    posicion_editorial: 2.8
    fuente_posicion: "Centro de medios independiente de \"publicación abierta\" (open publishing) activo desde 2001; cobertura autogestionada de movimientos sociales, pueblos originarios, feminismo y DDHH desde una perspectiva autonomista/izquierda de base, sin afiliación partidaria"

# Candidatos que todavía no validaron. Reintentar validar_feeds.py más
# adelante o buscar la URL correcta a mano.
candidatos:
# Medios de la lista original que siguen sin resolverse (URL no
# encontrada, o feed inexistente probado a mano).
pendientes:
  - medio: "C5N"
    problema: "Ninguna de las URLs de feed probadas (/feed, /rss, /arc/outboundfeeds/rss/) existe. Hay que buscar la URL correcta a mano en el sitio."
  - medio: "El Destape"
    problema: "Ninguna de las URLs probadas existe. Buscar la URL correcta a mano."
  - medio: "El Cronista"
    problema: "Su robots.txt prohíbe explícitamente el acceso automático a esa ruta. No se incluye por eso, no por falla técnica."
  - medio: "Noticias Argentinas"
    problema: "Es una agencia de cable (B2B); probablemente no tenga feed público. Revisar si ofrecen alguno o sacarla de la lista."
  - medio: "Prensa Obrera"
    problema: "Sin link rel=alternate de RSS en el HTML, y /feed, /feed/, /rss.xml no existen. Buscar la URL correcta a mano si el sitio la expone en otro lado."
  - medio: "Marcha"
    problema: "No se pudo verificar desde esta sesión: fetch bloqueado (fallo de conexión al robots.txt), no necesariamente el sitio esté caído. Reintentar desde un entorno sin esa restricción."
  - medio: "Resumen Latinoamericano"
    problema: "Mismo problema que Marcha: fetch bloqueado desde esta sesión (con y sin www), no verificado. Reintentar aparte."
  - medio: "Radio Gráfica"
    problema: "Mismo problema: fetch bloqueado desde esta sesión, no verificado."
  - medio: "Barricada TV"
    problema: "Mismo problema: fetch bloqueado desde esta sesión, no verificado. Además es un canal de TV, puede que no tenga feed de texto."
  - medio: "La Garganta Poderosa"
    problema: "feed_url probada (/feed/) da 404. Puede que usen otra ruta o que el sitio no tenga RSS."
  - medio: "ANRed"
    problema: "Fetch bloqueado (fallo de conexión al robots.txt) en dos intentos distintos, en dos sesiones distintas. Reintentar desde un entorno sin esa restricción antes de descartarlo del todo."
  - medio: "Agencia Paco Urondo"
    problema: "Sin link rel=alternate de RSS en el HTML de la home, y varias rutas comunes (/feed, /feed/) dan 404."
  - medio: "Notas - Periodismo Popular"
    problema: "Fetch bloqueado (robots.txt) en dos intentos. Reintentar desde un entorno sin esa restricción."

